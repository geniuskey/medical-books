<style>
  .gal-wrap { max-width: 1180px; margin: 0 auto; padding: 40px 16px 80px; }
  .gal-wrap h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.03em; margin: 10px 0 10px; }
  .gal-wrap > p { color: var(--text-dim); max-width: 760px; }
  .gal-count { font-family: var(--mono); font-size: 13px; color: var(--text-faint); margin: 0 0 10px; }
  .gal-card .big { font-size: 11px; color: var(--accent-2); font-weight: 700; }
  .gal-empty { color: var(--text-dim); padding: 30px 0; }
  .gal-filter .seg { flex: 0 1 auto; }
</style>

<body data-root="" data-page="sims">
<main class="gal-wrap">
  <div class="eyebrow">Simulator Gallery</div>
  <h1>시뮬레이터 갤러리</h1>
  <p>글을 읽지 않고 바로 만져 볼 수 있는 시뮬레이터를 모두 모았습니다. 카드를 누르면 해당 챕터가 <b>시뮬레이터만 보기</b> 모드로 열리고 그 시뮬레이터로 바로 이동합니다. 설명이 필요하면 챕터 상단의 "시뮬레이터만" 버튼을 다시 누르세요.</p>
  <div class="gal-filter">
    <input id="gal-q" type="search" placeholder="검색: 뼈, 척추, 무릎, 심장, 간, 뇌, 동맥, 단면…" aria-label="시뮬레이터 검색">
    <div class="seg" id="gal-mode"><button data-value="all" class="on">전체</button><button data-value="big">대표 시뮬레이터</button></div>
  </div>
  <div class="gal-count" id="gal-count"></div>
  <div id="gal"></div>
</main>
<script>
(function () {
  "use strict";
  var sims = window.BB_SIMS || [], q = document.getElementById("gal-q"), out = document.getElementById("gal"), count = document.getElementById("gal-count");
  var mode = BB.seg("gal-mode", render);
  function esc(s) { return String(s || "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function render() {
    var term = q.value.trim().toLowerCase(), n = 0;
    var html = BB.CHAPTERS.map(function (c) {
      var list = sims.filter(function (s) {
        if (s.ch !== c.slug) return false;
        if (mode() === "big" && !s.big) return false;
        return !term || (s.title + " " + s.desc + " " + c.title).toLowerCase().indexOf(term) >= 0;
      });
      if (!list.length) return "";
      n += list.length;
      var col = c.stage != null ? "var(--seg-" + BB.STAGES[c.stage].seg + ")" : "var(--accent)";
      return '<h2 class="gal-sec"><small>' + c.num + "</small>" + esc(c.title) + '</h2><div class="gal-grid">' + list.map(function (s) {
        return '<a class="gal-card" href="chapters/' + s.ch + ".html?sims=1#" + s.id + '"><i class="ico" style="background:' + col + '"></i><span class="ch">CH ' + s.num + (s.big ? ' · <span class="big">대표</span>' : "") + "</span><h3>" + esc(s.title) + "</h3><p>" + esc(s.desc) + "</p></a>";
      }).join("") + "</div>";
    }).join("");
    out.innerHTML = html || '<p class="gal-empty">찾는 시뮬레이터가 없습니다.</p>';
    count.textContent = n + "개 시뮬레이터" + (term ? " · '" + q.value.trim() + "' 검색 결과" : "");
  }
  q.addEventListener("input", render);
  render();
})();
</script>
</body>
</html>
